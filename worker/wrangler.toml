name = "supy-expansion"
main = "src/index.js"
compatibility_date = "2024-09-23"

# ── Non-secret config ─────────────────────────────────────────
# ALLOWED_ORIGINS locks CORS to the pages that host the form. Leave it out and
# the Worker accepts any origin, which is fine while testing and not fine once
# the endpoint is creating CRM records.
# PUBLIC_BASE_URL is this Worker's own origin, used to build /download links.
[vars]
# ALLOWED_ORIGINS = "https://vaishnavi-supy-io.github.io,https://app.supy.io"
# PUBLIC_BASE_URL = "https://supy-expansion.vaishnavi-5d1.workers.dev"

# ── KV: recent submission log (optional) ──────────────────────
#   npx wrangler kv namespace create LOGS
# [[kv_namespaces]]
# binding = "LOGS"
# id      = "REPLACE_ME"

# ── KV: per-IP rate limit (optional) ──────────────────────────
#   npx wrangler kv namespace create RATELIMIT
# [[kv_namespaces]]
# binding = "RATELIMIT"
# id      = "REPLACE_ME"

# ── Secrets — set via CLI, never written in this file ─────────
#   npx wrangler secret put CLIENT_ID              # HubSpot OAuth
#   npx wrangler secret put CLIENT_SECRET
#   npx wrangler secret put REFRESH_TOKEN
#   npx wrangler secret put SLACK_WEBHOOK_URL
#   npx wrangler secret put CLOUDINARY_CLOUD_NAME
#   npx wrangler secret put CLOUDINARY_API_KEY
#   npx wrangler secret put CLOUDINARY_API_SECRET
#   npx wrangler secret put ADMIN_TOKEN            # guards /debug and /logs
#   npx wrangler secret put FORM_SHARED_SECRET     # optional, see README
#
# The HubSpot and Cloudinary credentials are the same ones supy-onboarding
# already uses. Documents land under supy-expansion/{date}_{account}/ so the
# two forms never collide in storage.
